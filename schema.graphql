# rctHubBackend GraphQL Schema
# Phase 1 — 只读查询: 覆盖全部 domain 类型的 Query + 嵌套查询
# 完整 Schema (含 Phase 2/3 类型) 见 docs/schema-full.graphql

# =============================================================================
# 自定义标量
# =============================================================================

scalar Time     # time.Time — gqlgen 内置支持 (graphql.Time)
scalar ObjectID # bson.ObjectID hex — 映射为 string
scalar JSON     # 任意 JSON 值 — 用于事件 payload 等

# gqlgen 内置 directive: 控制字段生成行为
directive @goField(forceResolver: Boolean, name: String) on FIELD_DEFINITION

# 鉴权 directive (Phase 2 — §9.10 Read Model 角色裁剪)
# @requireRole: 检查 JWT claims 中的角色；admin=true 时也接受 ADMIN 角色
directive @requireRole(role: UserRole!, admin: Boolean = false) on FIELD_DEFINITION
# @public: 标记字段公开可访问 (no-op, 文档语义)
directive @public on FIELD_DEFINITION

# =============================================================================
# 枚举 (值用大写，domain 用小写/混合大小写，mapper 中转换)
# =============================================================================

enum UserRole {
  PLAYER
  STRATEGIST
  REFEREE
  STREAMER
  ADMIN
}

enum VerifyStatus {
  VERIFIED
  PENDING
  UNVERIFIED
}

enum RoomType {
  PRIVATE
  CASUAL
  MATCH
}

enum TeamSide {
  RED
  BLUE
}

enum MatchStatus {
  PENDING
  ACTIVE
  FINISHED
  CANCELED
}

enum MatchPhase {
  SETUP
  ROLL
  BAN
  PICK
  WIN
  TB
  ENDED
}

enum PieceMod {
  NM
  HD
  HR
  DT
  FM
  SHIRO
  TB
}

enum PieceState {
  NORMAL
  BANNED
  PICKED
  WON
  DEAD
}

enum MoveType {
  PICK
  UNPICK
  BAN
  UNBAN
  CLAIM
  WIN
  UNWIN
  ROB
  UNROB
  DEAD
  UNDEAD
  SURRENDER
}

enum WinReason {
  FOUR_IN_A_ROW
  TIE_BREAKER
  SURRENDER
  DRAW
  FORFEIT
}

enum BoardZone {
  NM
  HD
  HR
  DT
}

# =============================================================================
# 核心类型
# =============================================================================

type User {
  id: ObjectID!
  onlineID: Int!
  username: String!
  avatarURL: String!
  countryCode: String!
  globalRank: Int
  pp: Float
  verifyStatus: VerifyStatus!
  isBanned: Boolean!
  roles: [UserRole!]!
  createdAt: Time!
  updatedAt: Time!
}

type Room {
  id: ObjectID!
  code: String!
  name: String!
  type: RoomType!
  ownerID: Int!
  settings: RoomSettings!
  matchID: ID               # 内部关联, null 表示尚未开始比赛
  match: Match @goField(forceResolver: true)
  createdAt: Time!
  updatedAt: Time!
}

type RoomSettings {
  redStrategistUserID: Int
  blueStrategistUserID: Int
  streamerUserID: Int
  mappool: Mappool!
  firstPick: TeamSide
  firstBan: TeamSide
  redPlayers: [Int!]!
  bluePlayers: [Int!]!
  redLeader: Int
  blueLeader: Int
  mpLink: String
  streamLink: String
}

type Match {
  id: ObjectID!
  code: String!
  name: String!
  roomType: RoomType!
  roomID: ID!               # 内部关联
  status: MatchStatus!
  phase: MatchPhase          # 计算字段: from TurnState.Phase
  activeTeam: TeamSide       # 计算字段: from TurnState.ActiveTeam
  board: Board
  pool: Mappool
  teams: MatchTeams!
  bpOrder: BPOrder
  turnState: TurnState
  timer: TimerState

  # 嵌套查询 — 需要 service 调用
  moves(limit: Int = 50, offset: Int = 0): [Move!]! @goField(forceResolver: true)
  recentMove: Move @goField(forceResolver: true)
  room: Room @goField(forceResolver: true)

  # 客户端专属视图 (Phase 2 — Read Model §9.10)
  # 视图字段需要 forceResolver，因为计算逻辑需要重新获取 domain.Match
  strategistView: StrategistView! @requireRole(role: STRATEGIST) @goField(forceResolver: true)
  spectatorView: SpectatorView! @goField(forceResolver: true)
  overlayView: OverlayView! @goField(forceResolver: true)
  refereeView: RefereeView! @requireRole(role: REFEREE, admin: true) @goField(forceResolver: true)

  createdAt: Time!
  startedAt: Time
  finishedAt: Time
}

type MatchTeams {
  red: Team!
  blue: Team!
}

type Team {
  id: ObjectID!
  side: TeamSide!
  name: String!
  description: String!
  seed: String!
  color: String!
  leaderID: Int
  strategistID: Int
  players: [Int!]!
}

type Board {
  rows: Int!
  cols: Int!
  cells: [[BoardCell!]!]!
}

type BoardCell {
  position: Position!
  zone: BoardZone!
  state: String!
  pieceID: String
  teamID: String
}

type Piece {
  beatmapID: Int
  state: PieceState!
  teamID: String
  forceMod: String
  position: Position
}

type Position {
  row: Int!   # domain: Y
  col: Int!   # domain: X
}

type Mappool {
  slots: [PoolSlotGroup!]!
}

type PoolSlotGroup {
  mod: PieceMod!
  pieces: [PoolSlot!]!
}

type PoolSlot {
  mod: PieceMod!
  index: Int!
  beatmapID: Int           # osu! beatmap ID, null for Shiro/removed
  beatmap: Beatmap @goField(forceResolver: true)
  state: PieceState!
  teamID: String
  forceMod: String
  position: Position
}

type Beatmap {
  id: ObjectID!
  onlineID: Int!
  beatmapsetID: Int!
  title: String!
  artist: String!
  difficultyName: String!
  status: String!
  authorID: Int!
  rulesetID: Int!
  starRating: Float!
  bpm: Float!
  totalLength: Int!
  drainRate: Float!
  circleSize: Float!
  approachRate: Float!
  overallDifficulty: Float!
  coverURL: String!
  modString: String!
  modIndex: Int!
  skill: String
  comment: String
  isOriginal: Boolean!
  createdAt: Time!
  updatedAt: Time!
}

type Move {
  id: ObjectID!
  matchID: ObjectID!
  roomID: ObjectID!
  type: MoveType!
  teamSide: TeamSide
  operatorID: Int!
  slot: PoolSlot
  from: Position
  to: Position
  forceMod: String
  redScore: PlayerScore
  blueScore: PlayerScore
  comment: String!
  createdAt: Time!
}

type PlayerScore {
  userID: Int!
  score: Int!
  accuracy: Float!
  combo: Int!
  misses: Int
}

type BPOrder {
  firstPick: TeamSide!
  firstBan: TeamSide!
}

type TurnState {
  phase: MatchPhase!
  counter: Int!
  activeTeam: TeamSide
  action: String
  startedAt: Time
  timeLimit: Int    # seconds (domain: time.Duration)
  bonusTime: Int    # seconds
  bonusUsed: Boolean!
}

type TimerState {
  startedAt: Time
  timeLimit: Int!   # seconds (domain: time.Duration)
  bonusTime: Int!   # seconds
  bonusUsed: Boolean!
  isPaused: Boolean!
  pausedAt: Time
  remainingAtPause: Int  # seconds
}

type Announcement {
  id: ObjectID!
  pinned: Boolean!
  visible: Boolean!
  title: String!
  content: String!
  authorID: Int!
  publishedAt: Time
  createdAt: Time!
  updatedAt: Time!
}

# =============================================================================
# 客户端视图类型 (Phase 2 — Read Model §9.10)
# 每类客户端获取不同裁剪的数据视图，避免过度获取和欠获取
# =============================================================================

# --- 策略师视图: 当前可执行操作、可选格子、计时器 ---
type StrategistView {
  isMyTurn: Boolean!
  myTeam: TeamSide                # null 如果用户不是本比赛的策略师
  allowedActions: [String!]!
  disallowedActions: [String!]!
  selectablePoolSlots: [String!]! # 格式: "MOD-INDEX" 如 "NM-1"
  selectableBoardCells: [String!]! # 格式: "row,col" 如 "0,1"
  timer: TimerInfo!
  robberyInProgress: Boolean!
}

# --- 观众视图: 公开安全的棋盘摘要和比分 ---
type SpectatorView {
  board: BoardSummary!
  scores: TeamScores!
  currentPhase: MatchPhase!
  activeTeam: TeamSide
  turnNumber: Int
  recentMoves: [Move!]!
}

# --- OBS Overlay 视图: 极简渲染数据 ---
type OverlayView {
  board: BoardRenderData!
  scores: TeamScores!
  timer: TimerDisplay!
  lastEvent: DomainEventSnapshot  # null: WebSocket 事件系统尚未实现
}

# --- 裁判视图: 完整比赛数据 + 审计 ---
type RefereeView {
  board: Board!
  pool: Mappool!
  teams: MatchTeams!
  turnState: TurnState!
  timer: TimerState!
  auditLog(limit: Int = 50): [AuditEntry!]!    # 空: 审计系统尚未实现
  connectionStatus: [ClientConnection!]!        # 空: WebSocket 连接追踪尚未实现
}

# --- 视图支撑类型 ---

type BoardSummary {
  cells: [[CellSummary!]!]!
}

type CellSummary {
  position: Position!
  piece: PieceSummary              # null if cell is empty
}

type PieceSummary {
  mod: PieceMod!
  state: PieceState!
  owner: TeamSide                  # null if not owned
}

type BoardRenderData {
  cells: [[CellRender!]!]!
  lastChangedCells: [Position!]!   # 空: 变更追踪尚未实现
}

type CellRender {
  position: Position!
  zone: BoardZone!
  piece: PieceRender               # null if cell is empty
}

type PieceRender {
  mod: PieceMod!
  state: PieceState!
  owner: TeamSide
  beatmapCover: String             # 谱面封面 URL
}

type TeamScores {
  red: Int!
  blue: Int!
}

type TimerInfo {
  startedAt: Time!
  durationSeconds: Int!
  remainingSeconds: Int!
  isPaused: Boolean!
}

type TimerDisplay {
  remainingSeconds: Int!
  isPaused: Boolean!
  isWarning: Boolean!              # 剩余 < 10s 时为 true
}

type DomainEventSnapshot {
  type: String!
  payload: JSON!
  timestamp: Time!
}

type AuditEntry {
  actionId: ObjectID!
  matchId: ObjectID!
  sequence: Int!
  actorId: Int!
  actorRole: UserRole!
  commandType: String!
  previousVersion: Int!
  resultingVersion: Int!
  timestamp: Time!
  isAdminOverride: Boolean!
  reason: String
}

type ClientConnection {
  userID: Int!
  username: String!
  role: UserRole!
  teamSide: TeamSide
  isConnected: Boolean!
  lastSeenAt: Time
}

# =============================================================================
# 分页类型
# =============================================================================

type MatchPage {
  items: [Match!]!
  page: Int!
  perPage: Int!
  total: Int!
  totalPages: Int!
}

type RoomPage {
  items: [Room!]!
  page: Int!
  perPage: Int!
  total: Int!
  totalPages: Int!
}

type BeatmapPage {
  items: [Beatmap!]!
  page: Int!
  perPage: Int!
  total: Int!
  totalPages: Int!
}

type UserPage {
  items: [User!]!
  page: Int!
  perPage: Int!
  total: Int!
  totalPages: Int!
}

type AnnouncementPage {
  items: [Announcement!]!
  page: Int!
  perPage: Int!
  total: Int!
  totalPages: Int!
}

# =============================================================================
# Query
# =============================================================================

type Query {
  # 健康检查
  ping: String!

  # 认证
  me: User

  # 比赛
  match(id: ID!): Match
  matchByCode(code: String!): Match
  matches(status: MatchStatus, page: Int = 1, perPage: Int = 20): MatchPage!

  # 房间
  room(id: ID!): Room
  roomByCode(code: String!): Room
  rooms(type: RoomType, page: Int = 1, perPage: Int = 20): RoomPage!

  # 谱面
  beatmap(id: ID!): Beatmap
  beatmapByOsuId(osuId: Int!): Beatmap
  beatmaps(page: Int = 1, perPage: Int = 20): BeatmapPage!

  # 用户
  user(id: ID!): User
  users(page: Int = 1, perPage: Int = 20): UserPage!

  # 公告
  announcements(page: Int = 1, perPage: Int = 20): AnnouncementPage!
  announcement(id: ID!): Announcement
}

# =============================================================================
# Mutation (Phase 3 — Command Mutations)
# 复用现有 MatchService 方法，不引入新业务逻辑分支
# =============================================================================

# --- 通用 Command 元数据 (文档 §13) ---
input CommandMeta {
  matchId: ID!
  expectedVersion: Int!            # 乐观锁版本号 (当前预留，暂不强制校验)
  commandId: String!               # 客户端生成的幂等键
}

# --- Input 类型 ---

input PoolSlotRef {
  mod: PieceMod!
  index: Int!
}

input PositionInput {
  row: Int!                         # domain: Y
  col: Int!                         # domain: X
}

input BanPoolSlotInput {
  meta: CommandMeta!
  slot: PoolSlotRef!
}

input UnbanPoolSlotInput {
  meta: CommandMeta!
  slot: PoolSlotRef!
}

input PlacePieceInput {
  meta: CommandMeta!
  slot: PoolSlotRef!
  position: PositionInput!
  forceMod: String                  # FM 槽位的强制 mod
}

input GrantWinInput {
  meta: CommandMeta!
  team: TeamSide!
}

input ConfirmWinnerInput {
  meta: CommandMeta!
  team: TeamSide!
}

input BeginRobberyInput {
  meta: CommandMeta!
}

input CompleteRobberyInput {
  meta: CommandMeta!
  sacrificePieceIds: [String!]!
  targetPieceId: String!
}

input CancelRobberyInput {
  meta: CommandMeta!
}

input DeclareTbInput {
  meta: CommandMeta!
  winner: TeamSide!
}

input SurrenderInput {
  meta: CommandMeta!
  team: TeamSide!
}

input UndoInput {
  meta: CommandMeta!
  targetActionId: ID!
  reason: String!
}

# --- Result 类型 ---

interface CommandResult {
  success: Boolean!
  match: Match
  events: [DomainEventSnapshot!]!   # 预留: WebSocket 事件系统尚未实现，返回空数组
  error: MatchError
}

type MatchError {
  code: String!
  message: String!
  field: String
}

type BanPoolSlotResult implements CommandResult {
  success: Boolean!
  match: Match
  events: [DomainEventSnapshot!]!
  error: MatchError
}

type PlacePieceResult implements CommandResult {
  success: Boolean!
  match: Match
  events: [DomainEventSnapshot!]!
  error: MatchError
}

type CompleteRobberyResult implements CommandResult {
  success: Boolean!
  match: Match
  events: [DomainEventSnapshot!]!
  error: MatchError
}

type SimpleCommandResult implements CommandResult {
  success: Boolean!
  match: Match
  events: [DomainEventSnapshot!]!
  error: MatchError
}

# --- Mutation ---

type Mutation {
  # 棋盘操作 (文档 §12.1)
  banPoolSlot(input: BanPoolSlotInput!): BanPoolSlotResult!
  unbanPoolSlot(input: UnbanPoolSlotInput!): SimpleCommandResult!
  placePiece(input: PlacePieceInput!): PlacePieceResult!
  grantWinPermission(input: GrantWinInput!): SimpleCommandResult!
  confirmPieceWinner(input: ConfirmWinnerInput!): SimpleCommandResult!
  beginRobbery(input: BeginRobberyInput!): SimpleCommandResult!
  completeRobbery(input: CompleteRobberyInput!): CompleteRobberyResult!
  cancelRobbery(input: CancelRobberyInput!): SimpleCommandResult!

  # 终局
  declareTbWinner(input: DeclareTbInput!): SimpleCommandResult!
  declareSurrender(input: SurrenderInput!): SimpleCommandResult!

  # 回合控制
  advanceTurn(input: CommandMeta!): SimpleCommandResult!
  pauseMatch(input: CommandMeta!): SimpleCommandResult!
  resumeMatch(input: CommandMeta!): SimpleCommandResult!

  # 撤销
  undoAction(input: UndoInput!): SimpleCommandResult!
}
