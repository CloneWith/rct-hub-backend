# rctHubBackend GraphQL Schema
# Phase 0 — 脚手架: 仅包含 ping 验证 + me 查询 + User 核心类型
# 完整 Schema 见 docs/schema-full.graphql (Phase 1-3 逐步合并)

# =============================================================================
# 自定义标量
# =============================================================================

scalar Time     # time.Time — gqlgen 内置支持 (graphql.Time)
scalar ObjectID # bson.ObjectID hex — 映射为 string

# =============================================================================
# 枚举 (对应 domain 包中的类型，值用大写，domain 用小写，resolver 中转换)
# =============================================================================

enum UserRole {
  PLAYER
  STRATEGIST
  REFEREE
  STREAMER
  ADMIN
}

enum VerifyStatus {
  VERIFIED
  PENDING
  UNVERIFIED
}

# =============================================================================
# 核心类型
# =============================================================================

type User {
  id: ObjectID!
  onlineID: Int!
  username: String!
  avatarURL: String!
  countryCode: String!
  globalRank: Int
  pp: Float
  verifyStatus: VerifyStatus!
  isBanned: Boolean!
  roles: [UserRole!]!
  createdAt: Time!
  updatedAt: Time!
}

# =============================================================================
# Query
# =============================================================================

type Query {
  # 健康检查 / 脚手架验证
  ping: String!

  # 当前认证用户 (需要 JWT)
  me: User
}
