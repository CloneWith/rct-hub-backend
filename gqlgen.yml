# gqlgen 配置 — rctHubBackend GraphQL 代码生成
# 文档: https://gqlgen.com/config/

schema:
  - schema.graphql

exec:
  filename: internal/graphql/generated.go
  package: graphql

model:
  filename: internal/graphql/models_gen.go
  package: graphql

resolver:
  layout: follow-schema
  dir: internal/graphql
  package: graphql
  filename_template: "{name}.resolvers.go"

# Dependency ownership belongs to go.mod updates, not schema generation.
# This also keeps deterministic codegen usable in restricted CI/dev networks.
skip_mod_tidy: true

# 自定义标量映射
models:
  # Time → time.Time (gqlgen 内置, 序列化为 RFC3339 字符串)
  Time:
    model: github.com/99designs/gqlgen/graphql.Time
  # ObjectID → string (bson.ObjectID.Hex(), 在 resolver 中手动转换)
  ObjectID:
    model: github.com/99designs/gqlgen/graphql.String
  UInt64:
    model: github.com/99designs/gqlgen/graphql.String
  Match:
    extraFields:
      State:
        description: "Authoritative state captured with this GraphQL object; never exposed directly."
        type: rctHubBackend/internal/matchengine.State
