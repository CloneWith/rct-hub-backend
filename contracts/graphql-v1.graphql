# rctHubBackend GraphQL Schema
# Phase 1 — 只读查询: 覆盖全部 domain 类型的 Query + 嵌套查询

# =============================================================================
# 自定义标量
# =============================================================================

scalar Time     # time.Time — gqlgen 内置支持 (graphql.Time)
scalar ObjectID # bson.ObjectID hex — 映射为 string
scalar UInt64   # 十进制字符串，避免 GraphQL Int32 截断版本号

# gqlgen 内置 directive: 控制字段生成行为
directive @goField(forceResolver: Boolean, name: String) on FIELD_DEFINITION

# =============================================================================
# 枚举 (值用大写，domain 用小写/混合大小写，mapper 中转换)
# =============================================================================

enum UserRole {
  PLAYER
  STRATEGIST
  REFEREE
  STREAMER
  ADMIN
}

enum VerifyStatus {
  VERIFIED
  PENDING
  UNVERIFIED
}

enum RoomType {
  PRIVATE
  CASUAL
  MATCH
}

enum TeamSide {
  RED
  BLUE
}

enum PieceMod {
  NM
  HD
  HR
  DT
  FM
  SHIRO
  TB
}

enum PieceState {
  NORMAL
  BANNED
  PICKED
  WON
  DEAD
}

# =============================================================================
# 核心类型
# =============================================================================

type User {
  id: ObjectID!
  onlineID: ID!
  username: String!
  avatarURL: String!
  countryCode: String!
  globalRank: Int
  pp: Float
  verifyStatus: VerifyStatus!
  isBanned: Boolean!
  roles: [UserRole!]!
  createdAt: Time!
  updatedAt: Time!
}

type Room {
  id: ObjectID!
  code: String!
  name: String!
  type: RoomType!
  ownerID: ID!
  owner: User @goField(forceResolver: true)
  refereeUserID: ID
  referee: User @goField(forceResolver: true)
  round: String!
  scheduledAt: Time
  settings: RoomSettings!
  matchID: ID               # 内部关联, null 表示尚未开始比赛
  match: Match @goField(forceResolver: true)
  createdAt: Time!
  updatedAt: Time!
}

type RoomSettings {
  redStrategistUserID: ID
  redStrategist: User @goField(forceResolver: true)
  blueStrategistUserID: ID
  blueStrategist: User @goField(forceResolver: true)
  streamerUserID: ID
  streamer: User @goField(forceResolver: true)
  mappool: Mappool!
  firstPick: TeamSide
  firstBan: TeamSide
  redPlayers: [ID!]!
  bluePlayers: [ID!]!
  redLeader: ID
  blueLeader: ID
  mpLink: String
  streamLink: String
}

type Match {
  id: ObjectID!
  code: String!
  name: String!
  roomType: RoomType!
  roomID: ID!               # 内部关联
  room: Room @goField(forceResolver: true)
  pool: [MatchPoolSlotMetadata!]!

  # 客户端专属视图 (Phase 2 — Read Model §9.10)
  # 视图字段需要 forceResolver，因为计算逻辑需要重新获取 domain.Match
  strategistView: StrategistView @goField(forceResolver: true)
  captainView: CaptainView @goField(forceResolver: true)
  spectatorView: SpectatorView! @goField(forceResolver: true)
  overlayView: OverlayView! @goField(forceResolver: true)
  refereeView: RefereeView @goField(forceResolver: true)

  createdAt: Time!

  # 正式比赛唯一权威赛况。
  snapshot: MatchSnapshot!
}

type MatchPoolSlotMetadata {
  poolSlotID: ID!
  beatmapID: ID
  beatmap: Beatmap @goField(forceResolver: true)
}

enum MatchLifecycle {
  READY
  RUNNING
  SUSPENDED
  ADJUDICATION_REQUIRED
  FINISHED
  ABORTED
}

enum FormalMatchPhase {
  NONE
  BAN
  PICK
  WAITING_FOR_RESULT
  TB_PREPARATION
  TB_PLAYING
}

enum FormalBoardZone { DT HD HR }
enum PoolSlotState { AVAILABLE BANNED SELECTED }
enum BoardPieceOutcome { WAITING_RESULT WON WHITE DEAD }
enum ForceMod { NM HD HR }
enum TBBasis { CAPTAIN_AGREEMENT FORCED_AFTER_ROBBERY_CHECKS }
enum MatchResultReason { FOUR_ALIGNMENT TB SURRENDER STALEMATE_WON_COUNT }

enum MatchAction {
  START_MATCH
  BAN_POOL_SLOT
  PLACE_PIECE
  PLACE_SHIRO
  ROB_PIECE
  CONFIRM_BEATMAP_RESULT
  GRANT_ADDITIONAL_TIME
  CALIBRATE_TIMER
  PAUSE_TIMER
  RESUME_TIMER
  SUSPEND_MATCH
  RESUME_MATCH
  SKIP_CURRENT_ACTION
  ABORT_MATCH
  REQUEST_TB
  RESPOND_TB_REQUEST
  START_TB
  CONFIRM_TB_RESULT
  RECORD_SURRENDER
}

enum MatchCommandDisposition { APPLIED REPLAYED }
enum MatchActorCapability { STRATEGIST CAPTAIN REFEREE }

enum MatchEventType {
  MATCH_STARTED
  BAN_PHASE_STARTED
  POOL_SLOT_BANNED
  TURN_ADVANCED
  PICK_PHASE_STARTED
  PIECE_PLACED
  SHIRO_PLACED
  RESULT_CONFIRMATION_REQUESTED
  BEATMAP_RESULT_CONFIRMED
  PIECE_WON
  PIECES_SACRIFICED
  PIECE_ROBBED
  ADDITIONAL_TIME_GRANTED
  TIMER_CALIBRATED
  TIMER_PAUSED
  TIMER_RESUMED
  MATCH_SUSPENDED
  MATCH_RESUMED
  ACTION_SKIPPED
  MATCH_ABORTED
  REFEREE_PROXY_ACTION_RECORDED
  TB_REQUESTED
  TB_REQUEST_ACCEPTED
  TB_REQUEST_REJECTED
  TB_REQUEST_EXPIRED
  TB_FORCED
  TB_PREPARATION_STARTED
  TB_STARTED
  TB_RESULT_CONFIRMED
  SURRENDER_RECORDED
  MATCH_FINISHED
  STALEMATE_DETECTED
  ADJUDICATION_REQUIRED
  TIMER_STARTED
  TIMER_STOPPED
}

type MatchSnapshot {
  version: UInt64!
  lifecycle: MatchLifecycle!
  phase: FormalMatchPhase!
  firstBan: TeamSide!
  firstPick: TeamSide!
  turn: Int!
  activeTeam: TeamSide
  poolSlots: [FormalPoolSlot!]!
  board: FormalBoard!
  wonCounts: TeamCounts!
  timer: FormalTimer!
  robberyUsed: TeamFlags!
  teamPauseUsed: TeamFlags!
  rosters: FormalRosters!
  pendingPieceID: ID
  pendingTBRequest: PendingTBRequest
  tbEntry: TBEntry
  winner: TeamSide
  result: FormalMatchResult
  stalemate: StalemateEvidence
}

type FormalPoolSlot { id: ID!, mod: PieceMod!, state: PoolSlotState! }
type FormalBoard { cells: [FormalBoardCell!]! }
type FormalBoardCell {
  cell: ID!
  row: Int!
  col: Int!
  zone: FormalBoardZone!
  piece: FormalBoardPiece
}
type FormalBoardPiece {
  id: ID!
  sourcePoolSlotID: ID!
  mod: PieceMod!
  forceMod: ForceMod
  selectedBy: TeamSide!
  owner: TeamSide
  outcome: BoardPieceOutcome!
}
type FormalTimer {
  startedAt: Time
  durationMilliseconds: Int!
  paused: Boolean!
  remainingAtPauseMilliseconds: Int
}
type TeamFlags { red: Boolean!, blue: Boolean! }
type FormalRoster { leaderID: ID!, playerIDs: [ID!]! }
type FormalRosters { red: FormalRoster!, blue: FormalRoster! }
type PendingTBRequest { id: ID!, requestedBy: TeamSide!, basis: TBBasis! }
type TBEntry { basis: TBBasis!, requestID: ID, requestedBy: TeamSide }
type FormalMatchResult {
  winner: TeamSide!
  reason: MatchResultReason!
  surrenderingTeam: TeamSide
  confirmingPlayerIDs: [ID!]!
  wonCounts: TeamCounts!
}
type TeamCounts { red: Int!, blue: Int! }
type StalemateEvidence { wonCounts: TeamCounts! }

type LegalPlacement { poolSlotID: ID!, cell: ID!, forceMod: ForceMod }
type RobberyPlan { targetPieceID: ID!, sacrificeSets: [[ID!]!]! }
type MatchActorAnalysis {
  allowedActions: [MatchAction!]!
  banPoolSlotIDs: [ID!]!
  legalPlacements: [LegalPlacement!]!
  shiroCells: [ID!]!
  robberyPlans: [RobberyPlan!]!
  pendingTBRequestID: ID
  canAcceptTBRequest: Boolean!
  canRejectTBRequest: Boolean!
  tbRequestTeams: [TeamSide!]!
  tbResponseTeams: [TeamSide!]!
}

type Position {
  row: Int!   # domain: Y
  col: Int!   # domain: X
}

type Mappool {
  slots: [PoolSlotGroup!]!
}

type PoolSlotGroup {
  mod: PieceMod!
  pieces: [PoolSlot!]!
}

type PoolSlot {
  mod: PieceMod!
  index: Int!
  beatmapID: ID            # osu! beatmap ID, null for Shiro/removed
  beatmap: Beatmap @goField(forceResolver: true)
  state: PieceState!
  teamID: String
  forceMod: String
  position: Position
}

type Beatmap {
  id: ObjectID!
  onlineID: ID!
  beatmapsetID: ID!
  title: String!
  artist: String!
  difficultyName: String!
  status: String!
  authorID: ID!
  author: User @goField(forceResolver: true)
  rulesetID: Int!
  starRating: Float!
  bpm: Float!
  totalLength: Int!
  drainRate: Float!
  circleSize: Float!
  approachRate: Float!
  overallDifficulty: Float!
  coverURL: String!
  modString: String!
  modIndex: Int!
  selectorID: ID                # domain: SelectorID int64 (谱面选择者)
  selector: User @goField(forceResolver: true)
  creditUserIDs: [ID!]!         # domain: CreditUserIDs []int64 (贡献者)
  credits: [User!]! @goField(forceResolver: true)
  skill: String
  comment: String
  isOriginal: Boolean!
  createdAt: Time!
  updatedAt: Time!
}

type Announcement {
  id: ObjectID!
  pinned: Boolean!
  visible: Boolean!
  title: String!
  content: String!
  authorID: ID!
  author: User @goField(forceResolver: true)
  publishedAt: Time
  createdAt: Time!
  updatedAt: Time!
}

# =============================================================================
# 客户端视图类型 (Phase 2 — Read Model §9.10)
# 每类客户端获取不同裁剪的数据视图，避免过度获取和欠获取
# =============================================================================

# --- 策略师视图: 当前可执行操作、可选格子、计时器 ---
type StrategistView {
  isMyTurn: Boolean!
  myTeam: TeamSide!
  analysis: MatchActorAnalysis!
}

type CaptainView {
  myTeam: TeamSide!
  analysis: MatchActorAnalysis!
}

# --- 观众视图: 公开安全的棋盘摘要和比分 ---
type SpectatorView {
  board: FormalBoard!
  wonCounts: TeamCounts!
  currentPhase: FormalMatchPhase!
  activeTeam: TeamSide
  turnNumber: Int!
  lifecycle: MatchLifecycle!
}

# --- OBS Overlay 视图: 极简渲染数据 ---
type OverlayView {
  board: FormalBoard!
  wonCounts: TeamCounts!
  timer: FormalTimer!
  lifecycle: MatchLifecycle!
  phase: FormalMatchPhase!
  activeTeam: TeamSide
}

# --- 裁判视图: 完整比赛数据 + 审计 ---
type RefereeView {
  matchID: ID!
  snapshot: MatchSnapshot!
  analysis: MatchActorAnalysis!
  suspensionReason: String
  abortReason: String
  auditLog(limit: Int = 50): [AuditEntry!]! @goField(forceResolver: true)
}

type AuditEntry {
  actionId: ObjectID!
  matchId: ObjectID!
  sequence: UInt64!
  actor: MatchCommandActor!
  commandType: String!
  previousVersion: UInt64!
  resultingVersion: UInt64!
  timestamp: Time!
  reason: String
}

# =============================================================================
# 分页类型
# =============================================================================

type MatchPage {
  items: [Match!]!
  page: Int!
  perPage: Int!
  total: Int!
  totalPages: Int!
}

type RoomPage {
  items: [Room!]!
  page: Int!
  perPage: Int!
  total: Int!
  totalPages: Int!
}

type BeatmapPage {
  items: [Beatmap!]!
  page: Int!
  perPage: Int!
  total: Int!
  totalPages: Int!
}

type UserPage {
  items: [User!]!
  page: Int!
  perPage: Int!
  total: Int!
  totalPages: Int!
}

type AnnouncementPage {
  items: [Announcement!]!
  page: Int!
  perPage: Int!
  total: Int!
  totalPages: Int!
}

# =============================================================================
# Query
# =============================================================================

type Query {
  # 健康检查
  ping: String!

  # 认证
  me: User

  # 比赛
  match(id: ID!): Match
  matchByCode(code: String!): Match
  matches(page: Int = 1, perPage: Int = 20): MatchPage!

  # 房间
  room(id: ID!): Room
  roomByCode(code: String!): Room
  rooms(type: RoomType, search: String, round: String, status: MatchLifecycle, relatedToMe: Boolean = false, page: Int = 1, perPage: Int = 20): RoomPage!

  # 谱面
  beatmap(id: ID!): Beatmap
  beatmapByOsuId(osuId: Int!): Beatmap
  beatmaps(page: Int = 1, perPage: Int = 20): BeatmapPage!

  # 用户
  user(id: ID!): User
  users(page: Int = 1, perPage: Int = 20): UserPage!

  # 公告
  announcements(page: Int = 1, perPage: Int = 20): AnnouncementPage!
  announcement(id: ID!): Announcement
}

# =============================================================================
# Authoritative formal-match commands
# =============================================================================

input CommandMeta {
  matchId: ID!
  expectedVersion: UInt64!
  commandId: String!
}

input PositionInput {
  row: Int!
  col: Int!
}

input BanPoolSlotInput { meta: CommandMeta!, poolSlotId: String! }
input RefereeBanPoolSlotInput { meta: CommandMeta!, actingTeam: TeamSide!, poolSlotId: String!, reason: String! }
input PlacePieceInput { meta: CommandMeta!, poolSlotId: String!, position: PositionInput! }
input RefereePlacePieceInput { meta: CommandMeta!, actingTeam: TeamSide!, poolSlotId: String!, position: PositionInput!, reason: String! }
input PlaceShiroInput { meta: CommandMeta!, position: PositionInput! }
input RefereePlaceShiroInput { meta: CommandMeta!, actingTeam: TeamSide!, position: PositionInput!, reason: String! }
input RobPieceInput { meta: CommandMeta!, targetPieceId: String!, sacrificeSets: [[String!]!]! }
input RefereeRobPieceInput { meta: CommandMeta!, actingTeam: TeamSide!, targetPieceId: String!, sacrificeSets: [[String!]!]!, reason: String! }
input ReasonCommandInput { meta: CommandMeta!, reason: String! }
input CalibrateTimerInput { meta: CommandMeta!, remainingMilliseconds: Int!, reason: String! }
input RequestTbInput { meta: CommandMeta!, requestId: String! }
input RefereeRequestTbInput { meta: CommandMeta!, actingTeam: TeamSide!, requestId: String!, reason: String! }
input RespondTbRequestInput { meta: CommandMeta!, requestId: String!, accept: Boolean! }
input RefereeRespondTbRequestInput { meta: CommandMeta!, actingTeam: TeamSide!, requestId: String!, accept: Boolean!, reason: String! }
input ConfirmTbResultInput { meta: CommandMeta!, winningTeam: TeamSide! }
input ConfirmBeatmapResultInput { meta: CommandMeta!, boardPieceId: String!, winningTeam: TeamSide! }
input RecordSurrenderInput { meta: CommandMeta!, surrenderingTeam: TeamSide!, confirmingPlayerIds: [ID!]!, reason: String! }

enum MatchErrorCode {
  INVALID_REQUEST
  AUTH_REQUIRED
  USER_NOT_VERIFIED
  USER_BANNED
  GLOBAL_ROLE_REQUIRED
  ROOM_ROLE_REQUIRED
  ACTION_NOT_ALLOWED
  RESOURCE_NOT_FOUND
  MATCH_VERSION_CONFLICT
  DUPLICATE_COMMAND_MISMATCH
  INTERNAL_ERROR
  MATCH_LIFECYCLE_CONFLICT
  MATCH_PHASE_CONFLICT
  NOT_ACTIVE_TEAM
  INVALID_POOL_SLOT
  POOL_SLOT_UNAVAILABLE
  INVALID_BOARD_CELL
  INVALID_MOD_ZONE
  RESULT_NOT_PENDING
  TIMER_EXPIRED
  TIMER_PAUSED
  TEAM_PAUSE_ALREADY_USED
  ROBBERY_NOT_AVAILABLE
  ROBBERY_REQUIREMENTS_NOT_MET
  ALIGNMENT_OVERLAP
  TB_NOT_AVAILABLE
  SURRENDER_EVIDENCE_INVALID
}

type MatchError {
  code: MatchErrorCode!
  message: String!
  currentVersion: UInt64
}

type MatchCommandActor {
  osuID: ID!
  capability: MatchActorCapability!
  team: TeamSide
  adminOverride: Boolean!
  refereeOverride: Boolean!
}

type MatchEventFact {
  team: TeamSide
  poolSlotID: ID
  boardPieceID: ID
  boardPieceIDs: [ID!]!
  cell: ID
  durationMilliseconds: Int
  reason: String
  requestID: ID
  tbBasis: TBBasis
  playerIDs: [ID!]!
}

type MatchCommandEvent {
  eventId: ID!
  schemaVersion: Int!
  aggregateId: ID!
  aggregateType: String!
  sequence: UInt64!
  resultingVersion: UInt64!
  type: MatchEventType!
  occurredAt: Time!
  actor: MatchCommandActor!
  fact: MatchEventFact!
}

type MatchCommandResult {
  success: Boolean!
  commandId: String!
  disposition: MatchCommandDisposition
  previousVersion: UInt64
  resultingVersion: UInt64
  currentVersion: UInt64
  snapshot: MatchSnapshot
  events: [MatchCommandEvent!]!
  error: MatchError
}

type Mutation {
  startMatch(input: CommandMeta!): MatchCommandResult!
  banPoolSlot(input: BanPoolSlotInput!): MatchCommandResult!
  refereeBanPoolSlot(input: RefereeBanPoolSlotInput!): MatchCommandResult!
  placePiece(input: PlacePieceInput!): MatchCommandResult!
  refereePlacePiece(input: RefereePlacePieceInput!): MatchCommandResult!
  placeShiro(input: PlaceShiroInput!): MatchCommandResult!
  refereePlaceShiro(input: RefereePlaceShiroInput!): MatchCommandResult!
  robPiece(input: RobPieceInput!): MatchCommandResult!
  refereeRobPiece(input: RefereeRobPieceInput!): MatchCommandResult!
  confirmBeatmapResult(input: ConfirmBeatmapResultInput!): MatchCommandResult!
  grantAdditionalTime(input: ReasonCommandInput!): MatchCommandResult!
  calibrateTimer(input: CalibrateTimerInput!): MatchCommandResult!
  pauseTimer(input: ReasonCommandInput!): MatchCommandResult!
  resumeTimer(input: ReasonCommandInput!): MatchCommandResult!
  suspendMatch(input: ReasonCommandInput!): MatchCommandResult!
  resumeMatch(input: ReasonCommandInput!): MatchCommandResult!
  skipCurrentAction(input: ReasonCommandInput!): MatchCommandResult!
  abortMatch(input: ReasonCommandInput!): MatchCommandResult!
  requestTb(input: RequestTbInput!): MatchCommandResult!
  refereeRequestTb(input: RefereeRequestTbInput!): MatchCommandResult!
  respondTbRequest(input: RespondTbRequestInput!): MatchCommandResult!
  refereeRespondTbRequest(input: RefereeRespondTbRequestInput!): MatchCommandResult!
  startTb(input: ReasonCommandInput!): MatchCommandResult!
  confirmTbResult(input: ConfirmTbResultInput!): MatchCommandResult!
  recordSurrender(input: RecordSurrenderInput!): MatchCommandResult!
}
