name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Go verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: true

      - name: Run repository verification
        run: go run ./tools/verify

      - name: Check GraphQL generated code and fixtures
        run: |
          go run github.com/99designs/gqlgen generate
          go run ./tools/matchfixtures
          git diff --exit-code -- internal/graphql/generated.go internal/graphql/models_gen.go internal/graphql/schema.resolvers.go contracts/fixtures

      - name: Check GraphQL v1 compatibility
        run: go run ./tools/graphqlcompat

      - name: Start MongoDB replica set
        run: |
          docker run --detach --name rcthub-mongo-test --publish 27017:27017 \
            mongo:7.0.39 mongod --replSet rs0 --bind_ip_all
          for attempt in {1..30}; do
            if docker exec rcthub-mongo-test mongosh --quiet --eval \
              'db.adminCommand({ping: 1}).ok' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec rcthub-mongo-test mongosh --quiet --eval \
            'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
          for attempt in {1..30}; do
            if docker exec rcthub-mongo-test mongosh --quiet --eval \
              'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs rcthub-mongo-test
          exit 1

      - name: Run MongoDB replica-set integration tests
        env:
          MONGODB_TEST_URI: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
        run: go test -race -count=1 -run '^TestMongoIntegration' -v ./internal/persistence

      - name: Stop MongoDB replica set
        if: always()
        run: docker rm --force rcthub-mongo-test || true
